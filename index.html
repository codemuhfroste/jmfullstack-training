<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content makes the on-screen keyboard on
      Android shrink the layout instead of covering the editor.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1220" />
    <meta
      name="description"
      content="FSTraining: learn full stack web development with interactive HTML, CSS, JavaScript, PHP and SQL lessons that run in your browser."
    />
    <title>FSTraining · Full Stack Training</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236f51f5'/%3E%3Cpath d='M16 6l10 5-10 5-10-5z' fill='%23fff'/%3E%3Cpath d='M6 16l10 5 10-5M6 21l10 5 10-5' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <!-- Top bar: brand, navigation, streak / XP / level. Filled in by src/main.js. -->
    <header class="topbar">
      <a class="brand" href="#/" aria-label="FSTraining home">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-name">FS<span>Training</span></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="top-stats" id="top-stats"></div>
    </header>

    <!-- Pages are rendered here by src/router.js -->
    <main id="app" tabindex="-1"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
